apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: rhel-config-template
  namespace: default
spec:
  template:
    metadata: {}
    spec:
      files:
        - content: |-
            #!/bin/bash
            while ! [ "$(cat /sys/class/net/eth0/operstate)" = "up" ]
            do
                sleep 2
            done
            sleep 5
            ip route del default dev eth0
            # remove local DNS servers
            sed -i '/169.254.25.10/d' /etc/resolv.conf
            sed -i '/10.0.2.3/d' /etc/resolv.conf
            sed -i '/search/d' /etc/resolv.conf
            exit 0
          owner: root
          path: /etc/rc.d/rc.local
          permissions: "0500"
      format: cloud-config
      joinConfiguration:
        discovery: {}
        nodeRegistration:
          imagePullPolicy: IfNotPresent
      postKubeadmCommands:
        - systemctl start rc-local
        - systemctl enable rc-local
        - sysctl -w vm.max_map_count=262144
        - echo 'vm.max_map_count=262144' >> /etc/sysctl.conf
        - sysctl -w net.core.bpf_jit_limit=452534528
        - echo 'net.core.bpf_jit_limit=452534528' >> /etc/sysctl.conf
        - firewall-offline-cmd --add-port=4443/tcp
        - firewall-offline-cmd --zone=trusted --change-source=10.244.0.0/16
        - firewall-offline-cmd --remove-masquerade >> /run/cluster-api/firewalld.log
        - systemctl restart firewalld >> /run/cluster-api/firewalld.log
        - systemctl restart systemd-modules-load >> /run/cluster-api/systemd-modules-load.log
        - crictl pods | grep kube-proxy | awk '{ print $1 }' | xargs -I{} crictl stopp
          {} >> /run/cluster-api/crictl.log
        - 'echo ''eventRecordQPS: 0'' >> /var/lib/kubelet/config.yaml'
        - 'echo ''protectKernelDefaults: true'' >> /var/lib/kubelet/config.yaml'
        - systemctl daemon-reload >> /run/cluster-api/kubelet.log
        - systemctl restart kubelet >> /run/cluster-api/kubelet.log
      preKubeadmCommands:
        - echo 'DEFROUTE=no' >> /etc/sysconfig/network-scripts/ifcfg-eth0
        - echo 'IPV4_ROUTE_METRIC=10' >> /etc/sysconfig/network-scripts/ifcfg-eth1
        - nmcli networking off
        - nmcli networking on
        - systemctl restart NetworkManager
        - ip link set dev eth0 down
        - ip link set dev eth0 up
        - ip link set dev eth1 down
        - ip link set dev eth1 up
        - HOSTNAME=`hostname`
        - echo '127.0.0.1      '$HOSTNAME >>/etc/hosts
        - echo '{{ .Values.hostIP }}    'edgestack.harbor.core >>/etc/hosts
        - chsh -s /bin/bash capk