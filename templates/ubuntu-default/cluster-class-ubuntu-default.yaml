apiVersion: cluster.x-k8s.io/v1beta1
kind: ClusterClass
metadata:
  name: ubuntu-default-cluster-class
  namespace: {{ .Values.namespace }}
spec:
  controlPlane:
    machineHealthCheck:
      maxUnhealthy: 100%
      nodeStartupTimeout: 20m0s
      unhealthyConditions:
        - status: Unknown
          timeout: 5m0s
          type: Ready
        - status: "False"
          timeout: 5m0s
          type: Ready
    machineInfrastructure:
      ref:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: KubevirtMachineTemplate
        name: default-machine-template
        namespace: {{ .Values.namespace }}
    namingStrategy:
      template: {{`'{{ .cluster.name }}'`}}
    ref:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: KubeadmControlPlaneTemplate
      name: ubuntu-default-control-plane-template
      namespace: {{ .Values.namespace }}
  infrastructure:
    ref:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: KubevirtClusterTemplate
      name: default-cluster-template
      namespace: {{ .Values.namespace }}
  patches:
    - name: KubevirtControlPlaneMachineTemplatePatch
      definitions:
        - jsonPatches:
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/template/spec/architecture
              valueFrom:
                variable: architecture
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/template/spec/nodeSelector
              valueFrom:
                variable: nodeSelector
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/template/metadata/annotations
              valueFrom:
                variable: virtualMachineAnnotations
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/template/spec/domain/devices/interfaces/-
              valueFrom:
                variable: deviceInterface
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/template/spec/networks/-
              valueFrom:
                variable: network
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/dataVolumeTemplates
              valueFrom:
                variable: dataVolumeTemplate
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/template/spec/domain/cpu/cores
              valueFrom:
                variable: cores
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/template/spec/domain/memory/guest
              valueFrom:
                variable: memory
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/template/spec/domain/firmware
              valueFrom:
                variable: firmware
          selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: KubevirtMachineTemplate
            matchResources:
              controlPlane: true
    - name: KubevirtNodePoolMachineTemplatePatch
      definitions:
        - jsonPatches:
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/template/spec/architecture
              valueFrom:
                variable: architecture
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/template/spec/nodeSelector
              valueFrom:
                variable: nodeSelector
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/template/metadata/annotations
              valueFrom:
                variable: virtualMachineAnnotations
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/template/spec/domain/devices/interfaces/-
              valueFrom:
                variable: deviceInterface
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/template/spec/networks/-
              valueFrom:
                variable: network
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/dataVolumeTemplates
              valueFrom:
                variable: dataVolumeTemplate
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/template/spec/domain/cpu/cores
              valueFrom:
                variable: cores
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/template/spec/domain/memory/guest
              valueFrom:
                variable: memory
            - op: add
              path: /spec/template/spec/virtualMachineTemplate/spec/template/spec/domain/firmware
              valueFrom:
                variable: firmware
          selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: KubevirtMachineTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - default
  variables:
    - name: architecture
      required: false
      schema:
        openAPIV3Schema:
          default: arm64
          type: string
    - name: nodeSelector
      required: false
      schema:
        openAPIV3Schema:
          properties:
            kubernetes.io/arch:
              default: arm64
              type: string
          type: object
    - name: virtualMachineAnnotations
      required: true
      schema:
        openAPIV3Schema:
          properties:
            flavor:
              default: m1.xlarge
              type: string
            image:
              default: almalinux-8-v1.28-arm64
              type: string
            interfaces:
              type: string
            managedk8s:
              default: "true"
              type: string
            osDistro:
              default: almalinux-8
              type: string
            securityGroups:
              default: '["c5071a6b-d606-4fde-86c1-6bcc3160bb28", "eb99fdd0-560f-4f85-b3a4-3780a22f3a00"]'
              type: string
          required:
            - interfaces
          type: object
    - name: deviceInterface
      required: true
      schema:
        openAPIV3Schema:
          properties:
            bridge:
              type: object
            sriov:
              type: object
            name:
              type: string
          required:
            - name
          type: object
    - name: network
      required: true
      schema:
        openAPIV3Schema:
          properties:
            multus:
              properties:
                networkName:
                  type: string
              required:
                - networkName
              type: object
            name:
              type: string
          required:
            - name
            - multus
          type: object
    - name: dataVolumeTemplate
      required: true
      schema:
        openAPIV3Schema:
          items:
            properties:
              metadata:
                properties:
                  creationTimestamp:
                    type: string
                  name:
                    default: boot-volume
                    type: string
                  annotations:
                    type: object
                    properties:
                      cpuArch:
                        type: string
                      description:
                        type: string
                      osType:
                        type: string
                      osDistro:
                        type: string
                      managedk8s:
                        type: string
                        default: "true"
                type: object
              spec:
                properties:
                  preallocation:
                    default: true
                    type: boolean
                  pvc:
                    properties:
                      accessModes:
                        default:
                          - ReadWriteOnce
                        items:
                          type: string
                        type: array
                      resources:
                        properties:
                          requests:
                            properties:
                              storage:
                                default: 160Gi
                                type: string
                            type: object
                        type: object
                      storageClassName:
                        type: string
                    required:
                      - storageClassName
                    type: object
                  source:
                    properties:
                      pvc:
                        properties:
                          name:
                            default: almalinux-8-v1.28-arm64
                            type: string
                          namespace:
                            default: imagevolume
                            type: string
                        type: object
                    type: object
                required:
                  - pvc
                type: object
            required:
              - spec
              - metadata
            type: object
          type: array
    - name: cores
      required: false
      schema:
        openAPIV3Schema:
          default: 8
          type: integer
    - name: memory
      required: false
      schema:
        openAPIV3Schema:
          default: 16Gi
          type: string
    - name: firmware
      required: false
      schema:
        openAPIV3Schema:
          properties:
            bootloader:
              properties:
                efi:
                  properties:
                    secureBoot:
                      type: boolean
                  type: object
              type: object
          type: object
  workers:
    machineDeployments:
      - class: default
        namingStrategy:
          template: {{`'{{ .cluster.name }}-{{ .machineDeployment.topologyName }}'`}}
        template:
          bootstrap:
            ref:
              apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
              kind: KubeadmConfigTemplate
              name: ubuntu-default-config-template
              namespace: {{ .Values.namespace }}
          infrastructure:
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: KubevirtMachineTemplate
              name: default-machine-template
              namespace: {{ .Values.namespace }}